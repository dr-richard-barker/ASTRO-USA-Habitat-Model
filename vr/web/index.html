<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASTRO-USA Habitat Model</title>
<style>
  :root { --bg:#f4f6f8; --fg:#1d2733; --panel:#ffffffee; --muted:#5b6774; --accent:#2f5985; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161b; --fg:#e6ebf0; --panel:#1b2129ee; --muted:#9aa7b4; --accent:#7fb0e0; } }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,sans-serif; }
  #view { position:fixed; inset:0; }
  #panel { position:fixed; top:12px; left:12px; max-width:min(320px, calc(100vw - 24px)); background:var(--panel);
           border-radius:10px; padding:12px 14px; box-shadow:0 2px 12px #0003; }
  h1 { font-size:15px; margin:0 0 4px; } p { margin:4px 0; color:var(--muted); font-size:12px; }
  #layers label { display:block; font-size:13px; }
  #pick { margin-top:8px; font-size:13px; min-height:1.4em; color:var(--accent); }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1>ASTRO-USA Food Production Module</h1>
  <p>M0 block model generated from the sourced ledger (ICES-2026-251 Fig. 2 geometry). Drag to orbit, scroll to zoom, click a part.</p>
  <div id="layers"></div>
  <div id="pick" aria-live="polite"></div>
</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const LAYER = id => id === "container_shell" ? "Container shell" : id.startsWith("crew") ? "Crew"
  : id.startsWith("hvac") ? "HVAC grilles" : /canopy|zone/.test(id) ? "Source zones" : "Equipment";
const COLOR = { "Container shell":0x8a96a3, "Crew":0xe0a33a, "HVAC grilles":0x3fb6a8, "Source zones":0x6aa84f, "Equipment":0x3b6ea5 };

const el = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
el.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue("--bg").trim());
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 200);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(5, 10, 6); scene.add(sun);

const groups = {};
new GLTFLoader().load("assets/fpm_m0.glb", gltf => {
  const root = gltf.scene;
  root.traverse(o => {
    if (!o.isMesh) return;
    let n = o; while (n.parent && !n.name) n = n.parent;          // part node carries the registry id
    let id = n.name; let p = o; while (p && p !== root) { if (p.name && p.name !== "astro_usa_fpm_m0") id = p.name; p = p.parent; }
    const layer = LAYER(id);
    o.userData.part = id;
    o.material = new THREE.MeshStandardMaterial({ color:COLOR[layer], roughness:0.8, side:THREE.DoubleSide,
      transparent: layer !== "Equipment" && layer !== "Crew", opacity: layer === "Container shell" ? 0.18 : layer === "Source zones" ? 0.35 : 0.9 });
    (groups[layer] ??= []).push(o);
  });
  scene.add(root);
  const box = new THREE.Box3().setFromObject(root), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  controls.target.copy(c);
  camera.position.set(c.x + s.x * 0.15, c.y + s.x * 0.55, c.z + s.x * 0.75);
  const lay = document.getElementById("layers");
  for (const name of Object.keys(groups).sort()) {
    const lab = document.createElement("label"), cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = true; cb.onchange = () => groups[name].forEach(m => m.visible = cb.checked);
    lab.append(cb, " " + name + " (" + new Set(groups[name].map(m => m.userData.part)).size + ")"); lay.append(lab);
  }
  window.__habitat = { parts: [...new Set(Object.values(groups).flat().map(m => m.userData.part))].sort(), size: s.toArray(), overlays: [] };
  // CFD overlays listed in assets/overlays.json (written by habitat/cfd/slices.py)
  fetch("assets/overlays.json").then(r => r.ok ? r.json() : []).catch(() => []).then(list => {
    for (const ov of list) new GLTFLoader().load("assets/" + ov.file, g => {
      g.scene.traverse(o => { if (o.isMesh) { o.material = new THREE.MeshBasicMaterial({ vertexColors:true, side:THREE.DoubleSide });
                                              o.userData.part = ov.label; } });
      g.scene.visible = false; scene.add(g.scene); window.__habitat.overlays.push(ov.label);
      const lab = document.createElement("label"), cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = false; cb.onchange = () => { g.scene.visible = cb.checked;
        document.getElementById("pick").textContent = cb.checked ? ov.note : ""; };
      lab.append(cb, " CFD: " + ov.label); document.getElementById("layers").append(lab);
    });
  });
});

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
renderer.domElement.addEventListener("click", e => {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(scene.children, true).find(h => h.object.visible && h.object.userData.part !== "container_shell");
  document.getElementById("pick").textContent = hit ? "Part: " + hit.object.userData.part : "";
});
function resize() { const w = el.clientWidth, h = el.clientHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
